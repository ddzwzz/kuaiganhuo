name: KuaiGanHuo
options:
  bundleIdPrefix: com.kgh
  deploymentTarget:
    iOS: "17.4"
  createIntermediateGroups: true
  # 锁死工程格式为 Xcode 15.0，避免 XcodeGen 默认生成"未来格式(77)"，CI 上 Xcode 15.4 打不开
  projectFormat: xcode15_0

packages:
  KuaiGanHuCore:
    path: KuaiGanHuCore

targets:
  KuaiGanHuo:
    type: application
    platform: iOS
    sources:
      - path: KuaiGanHuo
    dependencies:
      - package: KuaiGanHuCore
    info:
      path: KuaiGanHuo/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: 快干活
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kgh.kuaiganhuo
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: false
        SWIFT_VERSION: "5.9"

schemes:
  KuaiGanHuo:
    build:
      targets:
        KuaiGanHuo: all
    run:
      config: Debug
